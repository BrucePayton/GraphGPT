name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra langchain --extra cli --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=graphgpt --cov-report=term-missing --cov-fail-under=90
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          graphgpt_wheel=$(find dist -name '*.whl' -print -quit)
          uv venv "$RUNNER_TEMP/graphgpt-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/graphgpt-wheel-venv/bin/python" "$graphgpt_wheel"
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" --version
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" init "$RUNNER_TEMP/graphgpt-smoke" --template loop
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" validate "$RUNNER_TEMP/graphgpt-smoke/workflow.yaml"
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" run "$RUNNER_TEMP/graphgpt-smoke/workflow.yaml" --input '{"count": 0}'
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" plugin init "$RUNNER_TEMP/graphgpt-plugin" --name ci-plugin
          uv build --project "$RUNNER_TEMP/graphgpt-plugin"
