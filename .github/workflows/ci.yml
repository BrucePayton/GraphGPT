name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra langchain --extra mcp --extra cli --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=graphgpt --cov-report=term-missing --cov-fail-under=90
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          graphgpt_wheel=$(find dist -name '*.whl' -print -quit)
          uv venv "$RUNNER_TEMP/graphgpt-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/graphgpt-wheel-venv/bin/python" "$graphgpt_wheel"
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" --version
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" init "$RUNNER_TEMP/graphgpt-smoke" --template loop
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" validate "$RUNNER_TEMP/graphgpt-smoke/workflow.yaml"
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" run "$RUNNER_TEMP/graphgpt-smoke/workflow.yaml" --input '{"count": 0}'
          "$RUNNER_TEMP/graphgpt-wheel-venv/bin/graphgpt" plugin init "$RUNNER_TEMP/graphgpt-plugin" --name ci-plugin
          uv build --project "$RUNNER_TEMP/graphgpt-plugin"

  minimum-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.11"
      - run: uv venv "$RUNNER_TEMP/graphgpt-minimum"
      - name: Install minimum supported ecosystem
        run: |
          uv pip install --python "$RUNNER_TEMP/graphgpt-minimum/bin/python" \
            -e '.[dev,langchain,mcp,cli]' \
            'langgraph==1.2.16' \
            'langchain==1.4.6' \
            'langchain-core==1.6.12' \
            'langgraph-cli[inmem]==0.4.36'
      - name: Run runtime and generated-project contracts
        run: |
          export PATH="$RUNNER_TEMP/graphgpt-minimum/bin:$PATH"
          "$RUNNER_TEMP/graphgpt-minimum/bin/python" -m pytest \
            tests/test_runtime_conformance.py \
            tests/test_runtime_security.py \
            tests/test_mcp.py \
            tests/test_tracing.py \
            tests/test_langgraph_cli_integration.py
