name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to publish
        required: true
        default: v0.1.0

jobs:
  pypi:
    if: github.event_name == 'push' || startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python
        run: uv python install 3.13

      - name: Build distributions
        if: github.event_name == 'push'
        run: uv build

      - name: Download existing GitHub Release distributions
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern 'graphgpt_builder-*.whl' --pattern 'graphgpt_builder-*.tar.gz' --dir dist

      - name: Smoke-test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "from graphgpt import __version__; from graphgpt.project import TEMPLATES; assert __version__; assert len(TEMPLATES) == 5"

      - name: Smoke-test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python -c \
            "from graphgpt import __version__; from graphgpt.project import TEMPLATES; assert __version__; assert len(TEMPLATES) == 5"

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish to PyPI with OIDC
        run: uv publish --trusted-publishing always
