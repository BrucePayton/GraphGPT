[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graphgpt-builder"
version = "0.8.0"
description = "Declarative, extensible compiler from versioned YAML workflows to native LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GraphGPT contributors" }]
keywords = ["langgraph", "langchain", "agents", "workflow", "yaml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "langgraph>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.15,<1.0",
]

[project.optional-dependencies]
langchain = ["langchain>=1.0,<2.0"]
cli = ["langgraph-cli[inmem]>=0.4,<1.0"]
langsmith = ["langsmith>=0.4,<1.0"]
langfuse = ["langfuse>=3.0,<4.0"]
dev = [
  "hatchling>=1.27",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
graphgpt = "graphgpt.cli:app"

[project.urls]
Homepage = "https://github.com/BrucePayton/GraphGPT"
Documentation = "https://github.com/BrucePayton/GraphGPT/tree/main/docs"
Repository = "https://github.com/BrucePayton/GraphGPT.git"
Issues = "https://github.com/BrucePayton/GraphGPT/issues"
Changelog = "https://github.com/BrucePayton/GraphGPT/blob/main/CHANGELOG.md"

[project.entry-points."graphgpt.nodes"]

[project.entry-points."graphgpt.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/graphgpt"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/schemas",
  "/README.md",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/ECOSYSTEM.md",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: exercises optional external development tooling"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["graphgpt"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["graphgpt"]
