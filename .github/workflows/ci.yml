name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra langchain --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=graphgpt --cov-report=term-missing
      - run: uv build

